[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arb"
version = "0.1.0"
description = "Kalshi/Polymarket cross-venue arbitrage decision core"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["arb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["arb", "tests"]
strict = true
warn_unreachable = true
